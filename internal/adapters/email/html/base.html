<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />

  <link href="https://fonts.googleapis.com/css?family=Noto+Sans:200,300,400,500,600,700" rel="stylesheet" />

  <style>
    html,
    body {
      margin: 0 auto !important;
      padding: 0 !important;
      height: 100% !important;
      width: 100% !important;
      background: #f1f1f1;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .email-header-logo {
      height: 90px;
      border-radius: 8px 8px 0 0;
      background: #1e40af;
      padding: 1em 2.5em 0 2.5em;
    }

    .email-footer {
      height: 80px;
      background: #f9f9f9;
      border-radius: 0 0 8px 8px;
      padding: 0 2.5em;
      text-align: left;
    }

    .email-footer p {
      color: #6e6e6e;
      font-size: 14px;
      font-weight: 600;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: "Noto Sans", sans-serif;
      margin-top: 0;
    }

    h4 {
      font-weight: normal;
      font-size: 14px;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.8;
    }

    .logo {
      padding-top: 36px;
    }

    .email-content {
      padding: 0 2.5em;
      text-align: left;
    }

    .email-content-body {
      background: #ffffff;
      padding: 2em 0 2em 0;
      position: relative;
      z-index: 0;
    }

    .email-content-body .email-content .text {
      color: #6e6e6e;
    }

    .email-content-body .email-content .text h1 {
      color: #323232;
      font-size: 32px;
      font-weight: 900;
    }

    .email-body {
      margin: 0;
      padding: 0 !important;
      mso-line-height-rule: exactly;
      background-color: #7b7b7b;
    }

    .email-center-container {
      width: 100%;
      background-color: #7b7b7b;
      padding-top: 26px;
      padding-bottom: 26px;
    }

    .button {
      text-decoration: none;
      padding: 8px 24px;
      display: inline-block;
      border-radius: 4px;
      background: #3b82f6;
      color: #ffffff !important;
      width: max-content;
    }

    .link {
      text-decoration: none;
      color: #3b82f6 !important;
    }
  </style>
</head>

<body width="100%" class="email-body">
  <center class="email-center-container">
    <div class="email-container">
      <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
          <td valign="top" class="email-header-logo">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td valign=" middle" class="email-content-body">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td class="email-content">
                  <div class="text">
                    {{block "body" .}} {{end}}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
        style="margin: auto">
        <tr>
          <td class="email-footer">{{index .Tmap "EmailFooter"}}</td>
        </tr>
      </table>
    </div>
  </center>
</body>

</html>
