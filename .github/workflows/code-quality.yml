name: Code Quality - Format, Tidy & Lint

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: ${{ secrets.GO_VERSION || '1.21' }}

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go Format Check
        run: |
          echo "🔍 Checking Go format..."
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ The following files are not properly formatted:"
            gofmt -s -l .
            echo "Please run: gofmt -s -w ."
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: Go Mod Tidy
        run: |
          echo "🔍 Checking go mod tidy..."
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "❌ go.mod or go.sum is not up to date"
            echo "Please run: go mod tidy"
            exit 1
          fi
          echo "✅ go.mod and go.sum are up to date"

      - name: Verify dependencies
        run: |
          echo "🔍 Verifying Go dependencies..."
          go mod verify
          echo "✅ All dependencies verified"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.2.1

      - name: golangci-lint
        run: make check
