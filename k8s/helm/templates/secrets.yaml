apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- end }}
  labels:
    {{- include "tech-challange-wherehouse-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.app.secrets.DB_PASSWORD | b64enc | quote }}
  JWT_SECRET: {{ .Values.app.secrets.JWT_SECRET | b64enc | quote }}
  NEW_RELIC_LICENSE_KEY: {{ .Values.app.secrets.NEW_RELIC_LICENSE_KEY | default "" | b64enc | quote }}
  EMAIL_API_KEY: {{ .Values.app.secrets.EMAIL_API_KEY | b64enc | quote }}
