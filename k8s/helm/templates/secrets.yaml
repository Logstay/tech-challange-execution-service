apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secret
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- end }}
  labels:
    {{- include "tech-challange-execution-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.app.secrets.DB_PASSWORD | default "" | b64enc | quote }}
  JWT_SECRET: {{ .Values.app.secrets.JWT_SECRET | default "" | b64enc | quote }}
  NEW_RELIC_LICENSE_KEY: {{ .Values.app.secrets.NEW_RELIC_LICENSE_KEY | default "" | b64enc | quote }}
  KAFKA_PASSWORD: {{ .Values.app.secrets.KAFKA_PASSWORD | default "" | b64enc | quote }}
